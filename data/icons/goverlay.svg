<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Screen Diagonal Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111822" />
      <stop offset="35%" stop-color="#152438" />
      <stop offset="70%" stop-color="#0F4C75" />
      <stop offset="92%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>

    <!-- Screen Border -->
    <linearGradient id="screenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243048" />
      <stop offset="60%" stop-color="#2D466E" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>
  </defs>

  <!-- Central HUD Screen -->
  <rect 
    x="76" 
    y="106" 
    width="360" 
    height="300" 
    rx="16" 
    ry="16" 
    fill="url(#screenGrad)" 
    stroke="url(#screenBorder)" 
    stroke-width="4" 
  />

  <!-- Solid Outer Sapphire Blue Brackets (#4895EF) -->
  <g stroke="#4895EF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 44 140 L 44 80 A 16 16 0 0 1 60 64 L 120 64" />
    <path d="M 392 64 L 452 64 A 16 16 0 0 1 468 80 L 468 140" />
    <path d="M 44 372 L 44 432 A 16 16 0 0 0 60 448 L 120 448" />
    <path d="M 392 448 L 452 448 A 16 16 0 0 0 468 432 L 468 372" />
  </g>

  <!-- Solid Inner White Core Highlight (#FFFFFF) -->
  <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 44 140 L 44 80 A 16 16 0 0 1 60 64 L 120 64" />
    <path d="M 392 64 L 452 64 A 16 16 0 0 1 468 80 L 468 140" />
    <path d="M 44 372 L 44 432 A 16 16 0 0 0 60 448 L 120 448" />
    <path d="M 392 448 L 452 448 A 16 16 0 0 0 468 432 L 468 372" />
  </g>
</svg>