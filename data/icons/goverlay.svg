<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="75%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>

    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Layer 3 (Backmost Layer) -->
  <path d="M 220 448 L 416 448 A 32 32 0 0 0 448 416 L 448 220" 
        stroke="url(#layerGrad2)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Layer 2 (Middle Layer) -->
  <path d="M 164 392 L 360 392 A 32 32 0 0 0 392 360 L 392 164" 
        stroke="url(#layerGrad1)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Layer 1 (Front Main Screen) -->
  <rect x="64" y="64" width="272" height="272" rx="32" ry="32"
        fill="url(#screenGrad)" stroke="#4895EF" stroke-width="24" />

  <!-- Crisp Core White Inner Stroke -->
  <rect x="64" y="64" width="272" height="272" rx="32" ry="32"
        fill="none" stroke="#FFFFFF" stroke-width="8" />
</svg>