<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111822" />
      <stop offset="35%" stop-color="#152438" />
      <stop offset="70%" stop-color="#0F4C75" />
      <stop offset="92%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>

    <linearGradient id="screenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>
  </defs>

  <style>
    .logotext {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Liberation Sans', sans-serif;
      font-weight: 800;
      font-size: 80px;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Liberation Sans', sans-serif;
      font-weight: 600;
      font-size: 26px;
      fill: #E2E8F0;
      letter-spacing: 2.9px;
    }
  </style>

  <g transform="translate(72, 10)">
    <text x="0" y="80" class="logotext">G</text>

    <!-- Layered 'O' Option A -->
    <g transform="translate(62, 22)">
      <path d="M 24 70 L 64 70 A 8 8 0 0 0 72 62 L 72 24" 
            stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 18 64 L 58 64 A 8 8 0 0 0 66 56 L 66 18" 
            stroke="#4895EF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <rect x="0" y="0" width="60" height="58" rx="8" ry="8"
            fill="url(#screenGrad)" stroke="#FFFFFF" stroke-width="4.8" />
      <rect x="3.5" y="3.5" width="53" height="51" rx="5" ry="5"
            fill="none" stroke="url(#screenBorder)" stroke-width="1.5" />
    </g>

    <text x="136" y="80" class="logotext">VERLAY</text>
  </g>

  <text x="72" y="156" class="tagline">Linux gaming tools, made easy</text>
</svg>