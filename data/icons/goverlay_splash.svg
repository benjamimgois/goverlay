<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111822" />
      <stop offset="35%" stop-color="#152438" />
      <stop offset="70%" stop-color="#0F4C75" />
      <stop offset="92%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>

    <linearGradient id="screenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>
  </defs>

  <style>
    .logotext {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Liberation Sans', sans-serif;
      font-weight: 800;
      font-size: 76px;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
    .tagline {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Liberation Sans', sans-serif;
      font-weight: 600;
      font-size: 26px;
      fill: #E2E8F0;
      letter-spacing: 1.45px;
    }
  </style>

  <g transform="translate(74, 10)">
    <text x="0" y="68" class="logotext">G</text>

    <!-- Layered 'O' -->
    <path d="M 88 88 L 126 88 A 8 8 0 0 0 134 80 L 134 40" 
          stroke="#2563EB" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 78 78 L 116 78 A 8 8 0 0 0 124 70 L 124 29" 
          stroke="#4895EF" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="58" y="10" width="58" height="58" rx="8" ry="8"
          fill="url(#screenGrad)" stroke="#FFFFFF" stroke-width="4.8" />
    <rect x="61" y="13" width="52" height="52" rx="5" ry="5"
          fill="none" stroke="url(#screenBorder)" stroke-width="1.5" />

    <text x="142" y="68" class="logotext">VERLAY</text>
