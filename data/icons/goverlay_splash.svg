<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="75%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>
    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <style>
    .logotext {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Liberation Sans', sans-serif;
      font-weight: 800;
      font-size: 80px;
      fill: #FFFFFF;
      letter-spacing: 1px;
    }
    .tagline {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Liberation Sans', sans-serif;
      font-weight: 600;
      font-size: 26px;
      fill: #E2E8F0;
      letter-spacing: 2.38px;
    }
  </style>

  <g transform="translate(80, 10)">
    <text x="8" y="88" class="logotext">G</text>

    <!-- Layered 'O' -->
    <g transform="translate(64, 14) scale(0.180)">
      <path d="M 220 448 L 416 448 A 32 32 0 0 0 448 416 L 448 220" 
            stroke="url(#layerGrad2)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 164 392 L 360 392 A 32 32 0 0 0 392 360 L 392 164" 
            stroke="url(#layerGrad1)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <rect x="64" y="64" width="272" height="272" rx="32" ry="32"
            fill="url(#screenGrad)" stroke="#4895EF" stroke-width="24" />
      <rect x="64" y="64" width="272" height="272" rx="32" ry="32"
            fill="none" stroke="#FFFFFF" stroke-width="8" />
    </g>

    <text x="160" y="88" class="logotext">VERLAY</text>
  </g>

  <text x="89" y="156" class="tagline">Linux gaming tools, made easy</text>
</svg>