<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111822" />
      <stop offset="35%" stop-color="#152438" />
      <stop offset="70%" stop-color="#0F4C75" />
      <stop offset="92%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>

    <linearGradient id="screenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>
  </defs>

  <style>
    .logotext {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Liberation Sans', sans-serif;
      font-weight: 800;
      font-size: 80px;
      fill: #FFFFFF;
      letter-spacing: 1px;
    }
    .tagline {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Liberation Sans', sans-serif;
      font-weight: 600;
      font-size: 26px;
      fill: #E2E8F0;
      letter-spacing: 2.38px;
    }
  </style>

  <g transform="translate(80, 10)">
    <text x="8" y="88" class="logotext">G</text>

    <!-- Layered 'O' Option 1 -->
    <g transform="translate(64, 14) scale(0.180)">
      <path d="M 200 452 L 420 452 A 28 28 0 0 0 448 424 L 448 200" 
            stroke="#2563EB" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 152 404 L 372 404 A 28 28 0 0 0 400 376 L 400 152" 
            stroke="#4895EF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <rect x="64" y="64" width="288" height="288" rx="28" ry="28"
            fill="url(#screenGrad)" stroke="#FFFFFF" stroke-width="22" />
      <rect x="80" y="80" width="256" height="256" rx="16" ry="16"
            fill="none" stroke="url(#screenBorder)" stroke-width="4" />
    </g>

    <text x="160" y="88" class="logotext">VERLAY</text>
  </g>

  <text x="89" y="156" class="tagline">Linux gaming tools, made easy</text>
</svg>