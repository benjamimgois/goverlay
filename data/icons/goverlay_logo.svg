      <rect x="64" y="64" width="272" height="272" rx="32" ry="32"
            fill="url(#screenGrad)" stroke="#4895EF" stroke-width="24" />
      <rect x="64" y="64" width="272" height="272" rx="32" ry="32"
            fill="none" stroke="#FFFFFF" stroke-width="8" />
