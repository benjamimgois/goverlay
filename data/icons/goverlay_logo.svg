<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 94" width="440" height="94">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111822" />
      <stop offset="35%" stop-color="#152438" />
      <stop offset="70%" stop-color="#0F4C75" />
      <stop offset="92%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>

    <linearGradient id="screenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>
  </defs>

  <style>
    .brandtext {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Segoe UI', 'Liberation Sans', sans-serif;
      font-weight: 800;
      font-size: 72px;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
  </style>

  <g transform="translate(4, 2)">
    <text x="0" y="64" class="brandtext">G</text>

    <!-- Layered 'O' (Square matches font height, layers extend naturally below/right) -->
    <!-- Layer 3 (Back - #2563EB) -->
    <path d="M 84 82 L 120 82 A 8 8 0 0 0 128 74 L 128 36" 
          stroke="#2563EB" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Layer 2 (Middle - #4895EF) -->
    <path d="M 74 73 L 111 73 A 8 8 0 0 0 119 65 L 119 26" 
          stroke="#4895EF" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Layer 1 (Front Screen - White Square) -->
    <rect x="56" y="10" width="54" height="54" rx="8" ry="8"
          fill="url(#screenGrad)" stroke="#FFFFFF" stroke-width="4.5" />
    <rect x="59" y="13" width="48" height="48" rx="5" ry="5"
          fill="none" stroke="url(#screenBorder)" stroke-width="1.4" />

    <text x="136" y="64" class="brandtext">VERLAY</text>
  </g>
</svg>