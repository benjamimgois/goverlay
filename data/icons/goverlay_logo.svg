<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="540" height="110">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111822" />
      <stop offset="35%" stop-color="#152438" />
      <stop offset="70%" stop-color="#0F4C75" />
      <stop offset="92%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <linearGradient id="screenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243048" />
      <stop offset="60%" stop-color="#2D466E" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="bracketGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .brandtext {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Segoe UI', 'Liberation Sans', sans-serif;
      font-weight: 800;
      font-size: 80px;
      fill: #FFFFFF;
      letter-spacing: 1px;
    }
  </style>

  <g transform="translate(18, 12)">
    <text x="0" y="80" class="brandtext">G</text>

    <g transform="translate(56, 4) scale(0.182)">
      <rect 
        x="76" 
        y="106" 
        width="360" 
        height="300" 
        rx="12" 
        ry="12" 
        fill="url(#screenGrad)" 
        stroke="url(#screenBorder)" 
        stroke-width="4" 
      />
      <g stroke="#00A8FF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#bracketGlow)">
        <path d="M 44 140 L 44 80 A 16 16 0 0 1 60 64 L 120 64" />
        <path d="M 392 64 L 452 64 A 16 16 0 0 1 468 80 L 468 140" />
        <path d="M 44 372 L 44 432 A 16 16 0 0 0 60 448 L 120 448" />
        <path d="M 392 448 L 452 448 A 16 16 0 0 0 468 432 L 468 372" />
      </g>
      <g stroke="#F0F9FF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 44 140 L 44 80 A 16 16 0 0 1 60 64 L 120 64" />
        <path d="M 392 64 L 452 64 A 16 16 0 0 1 468 80 L 468 140" />
        <path d="M 44 372 L 44 432 A 16 16 0 0 0 60 448 L 120 448" />
        <path d="M 392 448 L 452 448 A 16 16 0 0 0 468 432 L 468 372" />
      </g>
    </g>

    <text x="152" y="80" class="brandtext">VERLAY</text>
