<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 110" width="540" height="110">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111822" />
      <stop offset="35%" stop-color="#152438" />
      <stop offset="70%" stop-color="#0F4C75" />
      <stop offset="92%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>

    <linearGradient id="screenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>
  </defs>

  <style>
    .brandtext {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Segoe UI', 'Liberation Sans', sans-serif;
      font-weight: 800;
      font-size: 80px;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
  </style>

  <g transform="translate(12, 0)">
    <text x="0" y="80" class="brandtext">G</text>

    <!-- Layered 'O' Option B -->
    <g transform="translate(60, 23)">
      <!-- Layer 3 (Back) -->
      <path d="M 23.2 68 L 62 68 A 8 8 0 0 0 70 60 L 70 22.4" 
            stroke="#2563EB" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Layer 2 (Middle) -->
      <path d="M 17.4 62 L 56 62 A 8 8 0 0 0 64 54 L 64 16.8" 
            stroke="#4895EF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Layer 1 (Front Screen) -->
      <rect x="0" y="0" width="58" height="56" rx="8" ry="8"
            fill="url(#screenGrad)" stroke="#FFFFFF" stroke-width="4.5" />
      <rect x="3.5" y="3.5" width="51" height="49" rx="5" ry="5"
            fill="none" stroke="url(#screenBorder)" stroke-width="1.5" />
    </g>

    <text x="130" y="80" class="brandtext">VERLAY</text>
  </g>
</svg>