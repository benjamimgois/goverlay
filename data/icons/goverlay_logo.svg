<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 86" width="452" height="86">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111822" />
      <stop offset="35%" stop-color="#152438" />
      <stop offset="70%" stop-color="#0F4C75" />
      <stop offset="92%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>

    <linearGradient id="screenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#4895EF" />
    </linearGradient>
  </defs>

  <style>
    .brandtext {
      font-family: 'Fira Sans', 'Inter', 'Noto Sans', 'Segoe UI', 'Liberation Sans', sans-serif;
      font-weight: 800;
      font-size: 72px;
      fill: #FFFFFF;
      letter-spacing: 0.5px;
    }
  </style>

  <g transform="translate(8, 2)">
    <text x="0" y="62" class="brandtext">G</text>

    <!-- Layered 'O' Option A (Aligned with 56px cap height, 6px gap) -->
    <g transform="translate(56, 8)">
      <!-- Layer 3 (Back) -->
      <path d="M 22 66 L 58 66 A 7 7 0 0 0 65 59 L 65 22" 
            stroke="#2563EB" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Layer 2 (Middle) -->
      <path d="M 16 60 L 52 60 A 7 7 0 0 0 59 53 L 59 16" 
            stroke="#4895EF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

      <!-- Layer 1 (Front Screen) -->
      <rect x="0" y="0" width="55" height="54" rx="7" ry="7"
            fill="url(#screenGrad)" stroke="#FFFFFF" stroke-width="4.4" />
      <rect x="3" y="3" width="49" height="48" rx="4.5" ry="4.5"
            fill="none" stroke="url(#screenBorder)" stroke-width="1.4" />
    </g>

    <text x="128" y="62" class="brandtext">VERLAY</text>
  </g>
</svg>